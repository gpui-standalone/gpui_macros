[package]
name = "gpui_macros-gpui-standalone"
version = "1.5.3"
license = "Apache-2.0"
description = "Macros used by gpui"
edition = "2024"
repository = "https://github.com/zed-industries/zed"

[features]
inspector = []

[lib]
path = "src/gpui_macros.rs"
proc-macro = true
doctest = true
name = "gpui_macros"

[dependencies]
heck = "^0.5"
proc-macro2 = "^1.0.93"
quote = "^1.0.9"
syn = {version = "^2.0.101", features = ["full", "extra-traits", "visit-mut"]}
